<!DOCTYPE html>
<html lang="en">
<head>

    <title>Cadastar-se</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
     <!-- TELA DE LOGIN -->
      <section>
    <div class="cadastar-tela" id="cadastro">
        <div class="cadastro-caixa">
            <h2>🐾 Cadastrar</h2>
            <p class="subtitulo">Acesse sua conta Patas e Pelos</p>

            <form>
            <label for="email">E-mail</label>
            <input type="email" id="email" placeholder="seu@email.com" >

            <label for="senha">Senha</label>
            <input type="password" id="senha" placeholder="Sua senha" >

            <label for="confirmar senha">Confirmar Senha</label>
            <input type="password" id="senha" placeholder="confirme sua senha" >

            <button type="submit" class="botao"> <a href="/index.html"></a>Realizar Cadastro</button>
            </form>
            <a href="index.html">Voltar para o site</a>
        </div>
    </div>
</section>
</body>
</html>
